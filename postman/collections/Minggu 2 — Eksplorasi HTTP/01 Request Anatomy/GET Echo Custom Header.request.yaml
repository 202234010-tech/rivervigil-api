$kind: http-request
description: Request GET dengan custom header Accept dan X-Student-Client beserta post-response script untuk pengujian otomatis.
url: "{{echo_base_url}}/get?search=laravel api&page=2"
method: GET
headers:
  Accept: application/json
  X-Student-Client: postman-week-2
queryParams:
  search: laravel api
  page: "2"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is JSON", function () {
          pm.response.to.be.json;
      });

      pm.test("Custom header was received", function () {
          const body = pm.response.json();
          pm.expect(body.headers["x-student-client"]).to.eql("postman-week-2");
      });
    language: text/javascript
order: 2000
